name: Build Zed for Termux (aarch64 musl .deb)

on:
  workflow_dispatch:
    inputs:
      zed_ref:
        description: 'Zed git ref (branch/tag/commit)'
        required: false
        default: 'main'
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM: always
  MUSL_TARGET: aarch64-unknown-linux-musl
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget git zip unzip \
            build-essential cmake ninja-build \
            libclang-dev libssl-dev pkg-config \
            autoconf automake libtool \
            python3 python3-pip \
            openjdk-17-jdk-headless \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
          components: rustfmt,clippy,rust-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cargo-ndk and cargo-deb
        run: |
          cargo install cargo-ndk cargo-deb

      - name: Set up musl cross-compiler
        run: |
          MUSL_VERSION=1.1.24
          MUSL_HASH=x86_64
          wget -q "https://musl.libc.org/releases/musl-${MUSL_VERSION}.tar.gz"
          tar xzf musl-${MUSL_VERSION}.tar.gz
          cd musl-${MUSL_VERSION}
          ./configure --prefix=/opt/musl-cross --host=aarch64-linux-gnu --target=aarch64-linux-musl \
            CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar
          make -j$(nproc)
          sudo make install

      - name: Build native deps for musl
        run: |
          sudo apt-get install -y \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev \
            libvulkan-dev vulkan-validationlayers \
            libgit2-dev libssl-dev \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libasound2-dev libpulse-dev

      - name: Clone Zed
        run: |
          git clone --recursive --depth 1 \
            -b ${{ github.event.inputs.zed_ref || 'main' }} \
            https://github.com/zed-industries/zed.git \
            zed-src

      - name: Apply Termux patches
        run: |
          cd zed-src
          bash ../scripts/apply-patches.sh

      - name: Configure Cargo for musl
        run: |
          mkdir -p zed-src/.cargo
          cat > zed-src/.cargo/config.toml << 'CARGO_EOF'
          [build]
          rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
          CARGO_EOF

      - name: Build Zed (musl static)
        working-directory: zed-src
        run: |
          cargo build \
            --release \
            --target ${{ env.MUSL_TARGET }} \
            -p zed \
            2>&1 | tee build.log || {
              echo "Build failed, checking for known issues..."
              grep -i "error\|SIGSEGV\|cranelift" build.log | tail -20
              exit 1
            }

      - name: Build zd-exec helper
        working-directory: zed-src
        run: |
          cargo build \
            --release \
            --target ${{ env.MUSL_TARGET }} \
            -p zdroid_runtime --bin zd-exec 2>/dev/null || true

      - name: Create Termux .deb package
        run: |
          cd zed-src
          bash ../scripts/create-deb.sh ${{ env.MUSL_TARGET }}

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find . -name "*.deb" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zed-termux-aarch64
          path: artifacts/*.deb
          retention-days: 30
