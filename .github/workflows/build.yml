name: Build Zed for Termux (aarch64 musl .deb)

on:
  workflow_dispatch:
    inputs:
      zed_ref:
        description: 'Zed git ref (branch/tag/commit)'
        required: false
        default: 'main'
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM: always
  MUSL_TARGET: aarch64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget git zip unzip \
            build-essential cmake ninja-build \
            libclang-dev libssl-dev pkg-config \
            autoconf automake libtool \
            python3 python3-pip \
            openjdk-17-jdk-headless \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
          components: rustfmt,clippy,rust-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zed-src/target
          key: cargo-musl-${{ hashFiles('zed-src/**/Cargo.lock') }}
          restore-keys: cargo-musl-

      - name: Clone Zed
        run: |
          git clone --recursive --depth 1 \
            -b ${{ github.event.inputs.zed_ref || 'main' }} \
            https://github.com/zed-industries/zed.git \
            zed-src

      - name: Apply Termux patches
        run: |
          cd zed-src
          bash ../scripts/apply-patches.sh

      - name: Configure Cargo for musl
        run: |
          mkdir -p zed-src/.cargo
          cat > zed-src/.cargo/config.toml << 'CARGO_EOF'
          [build]
          rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
          CARGO_EOF

      - name: Build Zed (musl static)
        working-directory: zed-src
        run: |
          cargo build \
            --release \
            --target ${{ env.MUSL_TARGET }} \
            -p zed 2>&1 | tee build.log
          echo "Exit code: $?"

      - name: List build artifacts
        working-directory: zed-src
        run: |
          echo "=== Looking for binaries ==="
          find target/${{ env.MUSL_TARGET }}/release -maxdepth 1 -type f 2>/dev/null | head -20
          echo "=== All executables ==="
          find target/${{ env.MUSL_TARGET }} -type f -executable 2>/dev/null | head -20
          echo "=== ELF files ==="
          find target/${{ env.MUSL_TARGET }}/release -maxdepth 1 -type f -exec file {} \; 2>/dev/null | head -20

      - name: Create Termux .deb package
        working-directory: zed-src
        run: bash ../scripts/create-deb.sh ${{ env.MUSL_TARGET }}

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find zed-src -name "*.deb" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zed-termux-aarch64
          path: artifacts/*.deb
          retention-days: 30
